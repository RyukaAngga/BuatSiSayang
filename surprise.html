<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise - Birthday Scrapbook</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .surprise-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      color: #fffdfa;
      background-image: url('assets/backgrounds/red-paper.webp');
      background-size: cover;
    }
    .surprise-placeholder h1 {

      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>

<body>
  <main class="scrapbook-container">
    <div class="surprise-placeholder">
      <h1>💌 surprise.html</h1>
      <p>Halaman amplop terbuka (Surprise) akan dibangun pada langkah berikutnya setelah Hero section dicek dan disetujui.</p>
      <a href="index.html" class="back-btn">← Kembali ke Hero</a>
    </div>

</html>
